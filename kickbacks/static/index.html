<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kickbacks AI</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #16181d; --muted: #646b78;
    --line: #e2e5ea; --accent: #0f7b5f; --accent-text: #fff; --error: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111317; --card: #1a1d23; --text: #e8eaee; --muted: #9aa1ad;
      --line: #2c313a; --accent: #3fbf95; --accent-text: #0b1512; --error: #f97066;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header, main { max-width: 1000px; margin: 0 auto; padding: 16px; }
  header h1 { margin: 8px 0 0; font-size: 24px; }
  header p { margin: 4px 0 0; color: var(--muted); }
  main { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-top: 8px; }
  input, select, textarea { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 6px;
         background: var(--bg); color: var(--text); font: inherit; }
  button { margin-top: 10px; padding: 8px 14px; border: 0; border-radius: 6px; cursor: pointer;
           background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
  .stat { border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  code { background: var(--bg); padding: 2px 6px; border-radius: 4px; font-size: 14px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 6px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
  li small { color: var(--muted); }
  .amt { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .msg { font-size: 13px; margin-top: 8px; min-height: 1em; }
  .msg.error { color: var(--error); }
  #chat { max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
  .bubble { padding: 8px 10px; border-radius: 8px; white-space: pre-wrap; }
  .bubble.user { background: var(--accent); color: var(--accent-text); align-self: flex-end; max-width: 85%; }
  .bubble.assistant { background: var(--bg); border: 1px solid var(--line); align-self: flex-start; max-width: 85%; }
  .wide { grid-column: 1 / -1; }
</style>
</head>
<body>
<header>
  <h1>Kickbacks AI</h1>
  <p id="rules">Refer friends, earn a cut of what they spend, and ask the AI assistant anything about your rewards.</p>
</header>
<main>
  <section>
    <h2>Join</h2>
    <form id="join">
      <label for="name">Name</label><input id="name" required>
      <label for="email">Email</label><input id="email" type="email" required>
      <label for="code">Referral code (optional)</label><input id="code" placeholder="e.g. K7M2QX9P">
      <button>Create account</button>
      <div class="msg" id="join-msg"></div>
    </form>
  </section>

  <section>
    <h2>My account</h2>
    <label for="member">Member</label>
    <select id="member"></select>
    <div id="account" hidden>
      <p>Your referral code: <code id="my-code"></code></p>
      <div class="stats">
        <div class="stat"><b id="balance">$0.00</b><span>Balance</span></div>
        <div class="stat"><b id="earned">$0.00</b><span>Lifetime earned</span></div>
        <div class="stat"><b id="refs">0</b><span>Referrals</span></div>
      </div>
      <form id="purchase">
        <label for="amount">Record a purchase ($)</label>
        <input id="amount" type="number" min="0.01" step="0.01" required>
        <button>Record purchase</button>
        <button type="button" class="secondary" id="payout">Request payout</button>
      </form>
      <div class="msg" id="account-msg"></div>
    </div>
  </section>

  <section>
    <h2>Ask Kickbacks AI</h2>
    <div id="chat"></div>
    <form id="ask">
      <textarea id="question" rows="2" placeholder="How much have I earned from referrals this month?"></textarea>
      <button>Ask</button>
      <div class="msg" id="ask-msg"></div>
    </form>
  </section>

  <section>
    <h2>Activity</h2>
    <ul id="ledger"><li><small>Pick a member to see their activity.</small></li></ul>
  </section>

  <section class="wide">
    <h2>Leaderboard</h2>
    <ul id="leaderboard"></ul>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const money = (c) => (c < 0 ? "-" : "") + "$" + (Math.abs(c) / 100).toFixed(2);
let history = [];

async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Request failed");
  return data;
}

function flash(id, text, isError = false) {
  const el = $(id);
  el.textContent = text;
  el.className = "msg" + (isError ? " error" : "");
}

function el(tag, text, className) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (className) e.className = className;
  return e;
}

async function loadRules() {
  const r = await api("/api/rules");
  $("rules").textContent =
    `Refer friends: you both get ${money(r.signup_bonus_cents)}, then you earn ` +
    `${Math.round(r.kickback_rate * 100)}% of everything they spend. Cash out from ${money(r.min_payout_cents)}.`;
}

async function loadMembers(selectId) {
  const members = await api("/api/members");
  const sel = $("member");
  const current = selectId ?? sel.value;
  sel.replaceChildren(el("option", members.length ? "Choose a member…" : "No members yet"));
  sel.firstChild.value = "";
  for (const m of members) {
    const o = el("option", `${m.name} (${m.email})`);
    o.value = m.id;
    sel.append(o);
  }
  sel.value = current ?? "";
  await showMember();
}

async function showMember() {
  const id = $("member").value;
  $("account").hidden = !id;
  if (!id) return;
  const [m, ledger] = await Promise.all([api(`/api/members/${id}`), api(`/api/members/${id}/ledger`)]);
  $("my-code").textContent = m.referral_code;
  $("balance").textContent = money(m.balance_cents);
  $("earned").textContent = money(m.lifetime_earned_cents);
  $("refs").textContent = m.referral_count;
  const list = $("ledger");
  list.replaceChildren();
  if (!ledger.length) list.append(el("li", "No activity yet."));
  for (const e of ledger) {
    const li = el("li");
    const left = el("span");
    left.append(el("div", e.note || e.kind), el("small", `${e.kind} · ${e.created_at}`));
    li.append(left, el("span", money(e.amount_cents), "amt"));
    list.append(li);
  }
}

async function loadLeaderboard() {
  const rows = await api("/api/leaderboard");
  const list = $("leaderboard");
  list.replaceChildren();
  if (!rows.length) list.append(el("li", "Nobody has joined yet."));
  rows.forEach((r, i) => {
    const li = el("li");
    li.append(el("span", `${i + 1}. ${r.name} · ${r.referrals} referral${r.referrals === 1 ? "" : "s"}`),
              el("span", money(r.lifetime_earned_cents), "amt"));
    list.append(li);
  });
}

async function refresh(selectId) {
  await Promise.all([loadMembers(selectId), loadLeaderboard()]);
}

$("join").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    const m = await api("/api/members", {
      method: "POST",
      body: { name: $("name").value, email: $("email").value, referral_code: $("code").value || null },
    });
    e.target.reset();
    flash("join-msg", `Welcome, ${m.name}! Your code is ${m.referral_code}.`);
    history = [];
    $("chat").replaceChildren();
    await refresh(String(m.id));
  } catch (err) { flash("join-msg", err.message, true); }
});

$("member").addEventListener("change", () => {
  history = [];
  $("chat").replaceChildren();
  flash("account-msg", "");
  showMember();
});

$("purchase").addEventListener("submit", async (e) => {
  e.preventDefault();
  const id = $("member").value;
  try {
    const p = await api(`/api/members/${id}/purchases`, {
      method: "POST", body: { amount_cents: Math.round(parseFloat($("amount").value) * 100) },
    });
    e.target.reset();
    flash("account-msg", p.kickback_cents
      ? `Purchase recorded. Your referrer earned a ${money(p.kickback_cents)} kickback.`
      : "Purchase recorded.");
    await refresh(id);
  } catch (err) { flash("account-msg", err.message, true); }
});

$("payout").addEventListener("click", async () => {
  const id = $("member").value;
  try {
    const p = await api(`/api/members/${id}/payouts`, { method: "POST" });
    flash("account-msg", `Payout of ${money(p.paid_out_cents)} requested.`);
    await refresh(id);
  } catch (err) { flash("account-msg", err.message, true); }
});

$("ask").addEventListener("submit", async (e) => {
  e.preventDefault();
  const id = $("member").value;
  const question = $("question").value.trim();
  if (!id) return flash("ask-msg", "Pick a member first.", true);
  if (!question) return;
  $("chat").append(el("div", question, "bubble user"));
  $("question").value = "";
  flash("ask-msg", "Thinking…");
  try {
    const { answer } = await api(`/api/members/${id}/assistant`, {
      method: "POST", body: { question, history },
    });
    history.push({ role: "user", content: question }, { role: "assistant", content: answer });
    $("chat").append(el("div", answer, "bubble assistant"));
    flash("ask-msg", "");
  } catch (err) { flash("ask-msg", err.message, true); }
  $("chat").scrollTop = $("chat").scrollHeight;
});

loadRules();
refresh();
</script>
</body>
</html>
